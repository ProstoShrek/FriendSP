<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; connect-src http: https: ws: wss:; img-src 'self' data: blob: http: https:; style-src 'self' 'unsafe-inline'; media-src 'self' blob:">
  <title>SoundPad</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="titlebar">
    <div class="titlebar-brand">
      <svg viewBox="0 0 24 24" class="logo" aria-hidden="true"><path d="M4 9v6h3l5 4V5L7 9H4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      SoundPad
    </div>
    <div id="update-slot"></div>
    <div class="titlebar-buttons">
      <button data-win="minimize" title="Свернуть"><svg viewBox="0 0 12 12"><rect x="1" y="5.5" width="10" height="1" fill="currentColor"/></svg></button>
      <button data-win="maximize" title="Развернуть"><svg viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="currentColor"/></svg></button>
      <button data-win="close" class="close" title="Закрыть"><svg viewBox="0 0 12 12"><path d="M1 1l10 10M11 1L1 11" stroke="currentColor" stroke-width="1.2"/></svg></button>
    </div>
  </header>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toasts"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
