name: Сборка клиента для Windows

on:
  push:
    branches: [main]
    paths: ['client/**', '.github/workflows/build-client.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: SoundPad-Windows
          path: |
            client/dist/*.exe
          if-no-files-found: error
      # Для тега v* (например v0.1.0) создаётся релиз с установщиком — ссылку можно кидать друзьям
      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: client/dist/*.exe
