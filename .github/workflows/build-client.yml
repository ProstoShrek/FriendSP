name: Сборка клиента для Windows

# Пуш в main — тестовая сборка (артефакт в Actions).
# Тег v* (например v0.2.0) — релиз на GitHub, откуда программы друзей обновятся сами.
# Версия в теге должна совпадать с "version" в client/package.json.

on:
  push:
    branches: [main]
    paths: ['client/**', '.github/workflows/build-client.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci

      - name: Проверка версии тега
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          pkg=$(node -p "require('./package.json').version")
          if [ "v$pkg" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Тег ${GITHUB_REF_NAME} не совпадает с версией в package.json ($pkg)"
            exit 1
          fi

      - name: Сборка
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Сборка и публикация релиза
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run release
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: SoundPad-Windows
          path: client/dist/*.exe
          if-no-files-found: error
